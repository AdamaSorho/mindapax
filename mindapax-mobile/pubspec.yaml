name: mindapax_mobile
description: Mindapax mobile app built with Flutter.
publish_to: "none"

version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0
  permission_handler: ^11.3.1
  webview_flutter_android: ^3.16.0
  webview_flutter_wkwebview: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mindapax_logo.svg
