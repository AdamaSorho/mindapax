spring:
  application:
    name: mindapax-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${DB_NAME:mindapax_db}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
    initialization-mode: always

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      organization-id: ${OPENAI_ORGANIZATION_ID}
# debug: true
logging:
  level:
    com.adamasorho.mindapax_backend: DEBUG
    web: DEBUG
    org:
      springframework:
        security: DEBUG
        web: DEBUG
        servlet:
          mvc:
            method:
              annotation: DEBUG

jwt:
  secret: ${JWT_SECRET:byzedcoachingsecretkey123hdt252tsayd456789012345678901234567890}
  expiration: ${JWT_EXPIRATION_TIME:86400000}

app:
  jwt:
    refresh-token:
      expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:86400000}
  file-storage:
    upload-dir: uploads

# Zoom API Credentials
zoom:
  sdk_key: ${ZOOM_SDK_KEY}
  sdk_secret: ${ZOOM_SDK_SECRET}
  api:
    account-id: ${ZOOM_API_ACCOUNT_ID}
    client-id: ${ZOOM_API_CLIENT_ID}
    client-secret: ${ZOOM_API_CLIENT_SECRET}

# Payments – CinetPay Phase 1
payments:
  cinetpay:
    apiKey: ${CINETPAY_API_KEY:}
    siteId: ${CINETPAY_SITE_ID:}
    baseUrl: ${CINETPAY_BASE_URL:https://api-checkout.cinetpay.com}
    notifyUrl: ${CINETPAY_NOTIFY_URL:https://example.com/api/v1/payments/webhook/cinetpay}
    defaultReturnUrl: ${CINETPAY_RETURN_URL:https://example.com/payments/return}
