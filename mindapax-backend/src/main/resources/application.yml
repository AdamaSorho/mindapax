spring:
  application:
    name: mindapax-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${DB_NAME:mindapax_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    initialization-mode: always

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    database-platform: org.hibernate.dialect.MySQL8Dialect

# debug: true
logging:
  level:
    com.adamasorho.mindapax_backend: DEBUG
    web: DEBUG
    org:
      springframework:
        security: DEBUG
        web: DEBUG
        servlet:
          mvc:
            method:
              annotation: DEBUG

jwt:
  secret: ${JWT_SECRET:byzedcoachingsecretkey123hdt252tsayd456789012345678901234567890}
  expiration: ${JWT_EXPIRATION_TIME:86400000}

app:
  jwt:
    refresh-token:
      expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:86400000}
  file-storage:
    upload-dir: uploads

# Zoom API Credentials
zoom:
  sdk_key: ${ZOOM_SDK_KEY}
  sdk_secret: ${ZOOM_SDK_SECRET}
  api:
    account-id: ${ZOOM_API_ACCOUNT_ID}
    client-id: ${ZOOM_API_CLIENT_ID}
    client-secret: ${ZOOM_API_CLIENT_SECRET}

openai:
  api-key: ${OPENAI_API_KEY}
  apiKey: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:gpt-4o-mini}
