version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
  build:
    commands:
      - cd mindapax-backend
      - mvn clean package -DskipTests
      - mv target/*.jar mindapax-backend.jar
      - zip mindapax-backend.zip mindapax-backend.jar
      - aws s3 cp mindapax-backend.zip s3://mindapax-backend-bucket/
  post_build:
    commands:
      - export VERSION_LABEL="$CODEBUILD_RESOLVED_SOURCE_VERSION-$CODEBUILD_BUILD_NUMBER"
      - aws elasticbeanstalk create-application-version --application-name mindapax-backend --version-label $VERSION_LABEL --source-bundle S3Bucket=mindapax-backend-bucket,S3Key=mindapax-backend.zip
      - aws elasticbeanstalk update-environment --application-name mindapax-backend --environment-name mindapax-backend-env --version-label $VERSION_LABEL
