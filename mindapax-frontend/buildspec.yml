version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18 # Changed from 22 to 18 for better compatibility
    commands:
      - echo Install phase started on `date`
      - cd mindapax-frontend
      - npm install
      - echo Install phase completed on `date`

  pre_build:
    commands:
      - echo Pre-build phase started on `date`
      - npm run lint || echo "Linting failed, continuing..."
      - echo Pre-build phase completed on `date`

  build:
    commands:
      - echo Build phase started on `date`
      - npm run build
      - echo Build phase completed on `date`
      - ls -la dist/

  post_build:
    commands:
      - echo Post-build phase started on `date`
      - echo "Syncing files to S3..."
      - aws s3 sync dist/mindapax-frontend s3://mindapax-frontend-bucket --delete --cache-control "max-age=31536000"
      - echo "Creating CloudFront invalidation..."
      - DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='Mindapax frontend distribution'].Id" --output text)
      - if [ ! -z "$DISTRIBUTION_ID" ]; then aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"; else echo "Distribution not found"; fi
      - echo Post-build phase completed on `date`

artifacts:
  files:
    - "**/*"
  base-directory: mindapax-frontend/dist/mindapax-frontend
