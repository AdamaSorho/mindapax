<div class="p-6">
  <h2 class="text-2xl font-bold mb-4">My Subscriptions</h2>

  <!-- Toasts are now handled globally -->

  <div *ngIf="error" class="mb-3 p-3 bg-red-100 text-red-700 rounded">{{error}}</div>
  <div *ngIf="loading" class="text-gray-500">Loading…</div>

  <div *ngIf="!loading && subs.length === 0" class="p-4 bg-white rounded shadow">No subscriptions yet.</div>

  <div class="space-y-3" *ngIf="!loading && subs.length > 0">
    <div *ngFor="let s of subs" class="p-4 bg-white rounded shadow flex items-start justify-between">
      <div>
        <div class="font-semibold">{{s.planName}}</div>
        <div class="text-sm text-gray-600">Status: {{s.status}}</div>
        <div class="text-sm">Period: {{s.currentPeriodStart || '—'}} → {{s.currentPeriodEnd || '—'}}</div>
        <div class="text-sm" *ngIf="s.remainingSessions != null">Remaining sessions: {{s.remainingSessions}}</div>
      </div>
      <div class="text-right">
        <div class="text-sm text-gray-600">{{ s.planPrice | currencyFmt:s.planCurrency }} / month</div>
      </div>
    </div>
  </div>
</div>
