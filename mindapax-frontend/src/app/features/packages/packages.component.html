<div class="p-6">
  <h2 class="text-2xl font-bold mb-4">Packages</h2>

  <div *ngIf="error" class="mb-3 p-3 bg-red-100 text-red-700 rounded">{{error}}</div>
  <div *ngIf="loading" class="text-gray-500">Loading…</div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4" *ngIf="!loading">
    <div *ngFor="let p of plans" class="bg-white rounded shadow p-4 flex flex-col">
      <div class="flex-1">
        <div class="text-lg font-semibold">{{p.name}}</div>
        <div class="text-gray-600">{{ p.price | currencyFmt:p.currency }} / {{p.billingCycle.toLowerCase()}}</div>
        <div class="text-sm text-gray-600 mt-1" *ngIf="p.sessionAllowance">Includes {{p.sessionAllowance}} session(s) per cycle</div>
        <p class="mt-2" *ngIf="p.description">{{p.description}}</p>
        <ul class="mt-3 space-y-1">
          <li *ngFor="let f of featuresFor(p)" class="flex items-start text-sm text-gray-700">
            <span class="mr-2 text-green-600">✔</span>
            <span>{{ f }}</span>
          </li>
        </ul>
      </div>
      <button class="mt-4 px-4 py-2 bg-blue-600 text-white rounded" (click)="subscribe(p)" [disabled]="loading">Subscribe</button>
    </div>
  </div>

  <!-- Modal Checkout -->
  <div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
    <div class="bg-white rounded shadow-xl w-full max-w-3xl max-h-[90vh] flex flex-col">
      <div class="p-4 border-b flex items-center justify-between">
        <div class="font-semibold">Checkout</div>
        <button class="text-gray-500" (click)="showModal=false">✕</button>
      </div>
      <div class="p-4 flex-1 overflow-hidden">
        <iframe *ngIf="checkoutUrl" [src]="checkoutUrl" class="w-full h-[60vh] rounded border" referrerpolicy="no-referrer" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe>
        <div class="text-sm text-gray-600 mt-3">
          If the payment page fails to load, <a [href]="checkoutUrl" target="_blank" class="text-blue-600 underline">open in a new tab</a>.
        </div>
      </div>
      <div class="p-4 border-t flex items-center justify-between">
        <div class="text-sm" *ngIf="verifiedStatus">Status: {{verifiedStatus}}</div>
        <button class="px-4 py-2 bg-blue-600 text-white rounded" (click)="verifyPayment()" [disabled]="verifying">
          {{ verifying ? 'Verifying…' : "I've paid" }}
        </button>
      </div>
    </div>
  </div>
</div>
