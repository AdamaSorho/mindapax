<div class="flex flex-col h-full max-w-2xl mx-auto p-4">
  <div class="flex-1 overflow-y-auto space-y-4 mb-4">
    <div *ngFor="let msg of messages" [ngClass]="{'text-right': msg.sender === 'user'}">
      <div
        [ngClass]="msg.sender === 'user' ? 'inline-block bg-blue-600 text-white rounded-lg px-4 py-2' : 'inline-block bg-gray-200 text-gray-800 rounded-lg px-4 py-2'">
        {{ msg.text }}
      </div>
    </div>
  </div>
  <form (ngSubmit)="send()" class="flex items-center space-x-2">
    <input [(ngModel)]="message" name="message" type="text" placeholder="Ask the assistant..."
      class="flex-1 border rounded px-3 py-2" />
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Send</button>
  </form>
</div>
