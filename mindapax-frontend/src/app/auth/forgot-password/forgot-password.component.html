<div class="flex justify-center items-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50 min-h-screen">
  <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-indigo-600">Reset Password</h1>
      <p class="mt-2 text-gray-600">Enter your email to receive a password reset link</p>
    </div>

    <!-- Success Message -->
    <div *ngIf="emailSent" class="mb-6">
      <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
        <p class="font-medium">Email sent!</p>
        <p class="text-sm">We've sent a password reset link to your email address. Please check your inbox.</p>
      </div>

      <div class="text-center mt-6">
        <button (click)="goToLogin()"
          class="w-full justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Return to login
        </button>
      </div>
    </div>

    <!-- Form -->
    <div *ngIf="!emailSent">
      <!-- Error Message -->
      <div *ngIf="submitError" class="mb-4 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded relative"
        role="alert">
        <span class="block sm:inline">{{submitError}}</span>
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Email Field -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="email" formControlName="email"
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
            [ngClass]="{'border-red-500': forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched}"
            placeholder="your-email@example.com">
          <p *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
            class="mt-1 text-sm text-red-600">
            Please enter a valid email address
          </p>
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit" [disabled]="isSubmitting"
            class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-indigo-400 cursor-pointer">
            <span *ngIf="isSubmitting" class="absolute left-0 inset-y-0 flex items-center pl-3">
              <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
              </svg>
            </span>
            {{ isSubmitting ? 'Sending...' : 'Send Reset Link' }}
          </button>
        </div>

        <!-- Back to Login Link -->
        <div class="text-center mt-4">
          <p class="text-sm text-gray-600">
            Remember your password?
            <a routerLink="/auth/login" class="font-medium text-indigo-600 hover:text-indigo-500">
              Back to login
            </a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
