<header class="bg-white shadow-md fixed w-full z-50">
  <nav class="container mx-auto px-4 py-3 flex items-center justify-between">
    <!-- Logo -->
    <div class="flex items-center">
      <a routerLink="/" class="text-xl font-bold text-indigo-600">Mindapax</a>
    </div>

    <!-- Desktop Navigation -->
    <div class="hidden md:flex space-x-6">
      <a routerLink="/" class="text-gray-700 hover:text-indigo-600 font-medium">Home</a>
      <a routerLink="/about" class="text-gray-700 hover:text-indigo-600 font-medium">About</a>
      <a routerLink="/services" class="text-gray-700 hover:text-indigo-600 font-medium">Services</a>
      <a routerLink="/professionals" class="text-gray-700 hover:text-indigo-600 font-medium">Professionals</a>
      <a routerLink="/pricing" class="text-gray-700 hover:text-indigo-600 font-medium">Pricing</a>
      <a href="#" class="text-gray-700 hover:text-indigo-600 font-medium">Blog</a>
      <a routerLink="/contact" class="text-gray-700 hover:text-indigo-600 font-medium">Contact</a>
    </div>

    <!-- Login/Sign Up Button -->
    <div class="hidden md:flex items-center space-x-4">
      <a routerLink="/member/dashboard" class="text-gray-700 hover:text-indigo-600 font-medium">Login</a>
      <a routerLink="/auth/register"
        class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition duration-300">Sign
        Up</a>
    </div>

    <!-- Mobile Menu Button -->
    <div class="md:hidden">
      <button type="button" class="text-gray-500 hover:text-gray-700 focus:outline-none" (click)="toggleMenu()">
        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path *ngIf="!isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16" />
          <path *ngIf="isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div class="md:hidden" [ngClass]="{'block': isMenuOpen, 'hidden': !isMenuOpen}">
    <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 bg-white shadow-md">
      <a routerLink="/" class="block px-3 py-2 text-gray-700 hover:text-indigo-600 hover:bg-gray-50 rounded-md">Home</a>
      <a routerLink="/about"
        class="block px-3 py-2 text-gray-700 hover:text-indigo-600 hover:bg-gray-50 rounded-md">About</a>
      <a routerLink="/services"
        class="block px-3 py-2 text-gray-700 hover:text-indigo-600 hover:bg-gray-50 rounded-md">Services</a>
      <a routerLink="/professionals"
        class="block px-3 py-2 text-gray-700 hover:text-indigo-600 hover:bg-gray-50 rounded-md">Professionals</a>
      <a routerLink="/pricing"
        class="block px-3 py-2 text-gray-700 hover:text-indigo-600 hover:bg-gray-50 rounded-md">Pricing</a>
      <a href="#" class="block px-3 py-2 text-gray-700 hover:text-indigo-600 hover:bg-gray-50 rounded-md">Blog</a>
      <a routerLink="/contact"
        class="block px-3 py-2 text-gray-700 hover:text-indigo-600 hover:bg-gray-50 rounded-md">Contact</a>
      <div class="flex space-x-4 px-3 py-2">
        <a href="/member/dashboard" class="text-gray-700 hover:text-indigo-600 font-medium">Login</a>
        <a href="/auth/register"
          class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition duration-300">Sign Up</a>
      </div>
    </div>
  </div>
</header>
